apiVersion: batch/v1
kind: CronJob
metadata:
  name: totalkredit-scraper
  namespace: totalkredit
spec:
  schedule: "15 7-17 * * 1-5"
  timeZone: Europe/Copenhagen
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: scraper
              image: ghcr.io/andersspringborg/totalkredit:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATA_DIR
                  value: /data
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://victoria-victoria-metrics-single-server.metrics.svc.cluster.local:8428/opentelemetry/v1/metrics
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: totalkredit-data
